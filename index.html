<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - EsporteBR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="admin-header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">⚽</span>
                <h1>Esporte<span class="brasil">BR</span></h1>
            </div>
            <div class="header-actions">
                <button id="logout-btn" class="btn btn-outline btn-sm">
                    <span class="btn-icon">🚪</span>
                    Sair
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="admin-main">
        <div class="container">
            <!-- Stats Section -->
            <section class="stats-section">
                <div class="stat-card">
                    <div class="stat-icon">📅</div>
                    <div class="stat-info">
                        <strong id="total-events">0</strong>
                        <span>Total de Eventos</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-info">
                        <strong id="total-participants">0</strong>
                        <span>Participantes</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-info">
                        <strong id="active-events">0</strong>
                        <span>Ativos</span>
                    </div>
                </div>
            </section>

            <!-- Actions Bar -->
            <section class="actions-bar">
                <h2>Meus Eventos</h2>
                <button class="btn btn-primary" onclick="openModal('create-event-modal')">
                    <span class="btn-icon">➕</span>
                    Criar Evento
                </button>
            </section>

            <!-- Events List -->
            <section id="events-list" class="events-grid">
                <!-- Events will be rendered here -->
            </section>
        </div>
    </main>

    <!-- Create Event Modal -->
    <div id="create-event-modal" class="modal">
        <div class="modal-backdrop" data-close-modal></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Criar Novo Evento</h2>
                <button class="modal-close" data-close-modal>×</button>
            </div>
            <form id="create-event-form" class="modal-body">
                <div class="form-group">
                    <label for="event-title">Título do Evento</label>
                    <input type="text" id="event-title" required placeholder="Ex: Pelada de Sábado">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="event-sport">Esporte</label>
                        <select id="event-sport" required>
                            <option value="futebol">Futebol</option>
                            <option value="basquete">Basquete</option>
                            <option value="volei">Vôlei</option>
                            <option value="tenis">Tênis</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="event-max">Máx. Participantes</label>
                        <input type="number" id="event-max" min="2" max="100" value="22" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="event-date">Data</label>
                        <input type="date" id="event-date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="event-time">Horário</label>
                        <input type="time" id="event-time" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="event-location">Localização</label>
                    <input type="text" id="event-location" required placeholder="Endereço ou nome do local">
                </div>
                
                <div class="form-group">
                    <label for="event-cost">Custo Total (R$)</label>
                    <input type="number" id="event-cost" min="0" step="0.01" value="0" placeholder="0 = Grátis">
                    <span class="form-hint">Valor total do evento (será dividido entre participantes)</span>
                </div>
                
                <div class="form-group">
                    <label for="event-description">Descrição</label>
                    <textarea id="event-description" rows="3" placeholder="Detalhes adicionais sobre o evento"></textarea>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button>
                    <button type="submit" class="btn btn-primary">Criar Evento</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
