<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EsporteBR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <span class="logo-icon">⚽</span>
                    <h1>Esporte<span class="brasil">BR</span></h1>
                </div>
                <p class="login-subtitle">Gerencie seus eventos esportivos com facilidade</p>
            </div>

            <!-- Formulário de Login -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="loginEmail">E-mail</label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        name="email" 
                        placeholder="seu@email.com"
                        required
                        autocomplete="email"
                    >
                    <span class="form-hint">Digite seu e-mail de acesso</span>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Senha</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        name="password" 
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    <span class="btn-text">Entrar</span>
                    <span class="btn-loader" style="display: none;">
                        <span class="spinner"></span>
                    </span>
                </button>
            </form>

            <div class="login-footer">
                <p class="login-hint">
                    <strong>Login de teste:</strong><br>
                    E-mail: admin@admin.com<br>
                    Senha: admin
                </p>
                <p>
                    <small>
                        Ao entrar, você concorda com nossos 
                        <a href="#">Termos de Uso</a> e 
                        <a href="#">Política de Privacidade</a>
                    </small>
                </p>
            </div>
        </div>

        <div class="login-background">
            <div class="bg-shape bg-shape-1"></div>
            <div class="bg-shape bg-shape-2"></div>
            <div class="bg-shape bg-shape-3"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Script específico para a página de login
        document.addEventListener('DOMContentLoaded', function() {
            var loginForm = document.getElementById('loginForm');
            
            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    var email = document.getElementById('loginEmail').value;
                    var password = document.getElementById('loginPassword').value;
                    var btn = this.querySelector('button[type="submit"]');
                    var btnText = btn.querySelector('.btn-text');
                    var btnLoader = btn.querySelector('.btn-loader');
                    
                    // Loading state
                    btnText.style.display = 'none';
                    btnLoader.style.display = 'inline';
                    btn.disabled = true;
                    
                    // Simular autenticação
                    setTimeout(function() {
                        // Login de teste hardcoded
                        if (email === 'admin@admin.com' && password === 'admin') {
                            localStorage.setItem('userLoggedIn', 'true');
                            localStorage.setItem('userEmail', email);
                            localStorage.setItem('userName', 'Administrador');
                            localStorage.setItem('userType', 'admin');
                            
                            window.location.href = 'index.html';
                        } else {
                            alert('E-mail ou senha inválidos!\n\nUse:\nE-mail: admin@admin.com\nSenha: admin');
                            btnText.style.display = 'inline';
                            btnLoader.style.display = 'none';
                            btn.disabled = false;
                        }
                    }, 800);
                });
            }
        });
    </script>
</body>
</html>
