<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento - EsporteBR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="event-header">
        <div class="header-content">
            <button id="back-to-admin" class="btn btn-outline btn-sm">
                <span class="btn-icon">←</span>
                Voltar
            </button>
            <div class="logo">
                <span class="logo-icon">⚽</span>
                <h1>Esporte<span class="brasil">BR</span></h1>
            </div>
            <div class="header-spacer"></div>
        </div>
    </header>

    <!-- Loading State -->
    <div id="loading-state" class="loading-container">
        <div class="spinner-large"></div>
        <p>Carregando evento...</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="error-container hidden">
        <div class="error-icon">❌</div>
        <h2>Evento não encontrado</h2>
        <p>Este evento não existe ou foi removido.</p>
        <button class="btn btn-primary" onclick="window.location.href='index.html'">
            Voltar ao Painel
        </button>
    </div>

    <!-- Event Content -->
    <main id="event-content" class="event-main hidden">
        <div class="container">
            <!-- Event Header -->
            <section class="event-hero">
                <div class="event-sport-badge" id="event-sport-display">Futebol</div>
                <h1 id="event-title-display">Título do Evento</h1>
                <div class="event-meta">
                    <div class="meta-item">
                        <span class="meta-icon">📅</span>
                        <span id="event-date-display">Data</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-icon">⏰</span>
                        <span id="event-time-display">Horário</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-icon">📍</span>
                        <span id="event-location-display">Local</span>
                    </div>
                </div>
            </section>

            <!-- Event Stats -->
            <section class="event-stats">
                <div class="stat-box">
                    <strong id="participants-count">0</strong>
                    <span>Participantes</span>
                </div>
                <div class="stat-box">
                    <strong id="waitlist-count">0</strong>
                    <span>Lista de Espera</span>
                </div>
                <div class="stat-box">
                    <strong id="max-participants">22</strong>
                    <span>Máximo</span>
                </div>
                <div class="stat-box">
                    <strong id="cost-per-person">R$ 0,00</strong>
                    <span>Por Pessoa</span>
                </div>
            </section>

            <!-- Main Actions -->
            <section class="event-actions-section">
                <button id="join-event-btn" class="btn btn-primary btn-lg btn-full">
                    <span class="btn-icon">✅</span>
                    Confirmar Presença
                </button>
                <button id="add-guest-btn" class="btn btn-secondary btn-lg btn-full">
                    <span class="btn-icon">➕</span>
                    Adicionar Convidado
                </button>
            </section>

            <!-- Description -->
            <section class="event-section">
                <h2>Descrição</h2>
                <p id="event-description-display" class="event-description">
                    Sem descrição disponível.
                </p>
            </section>

            <!-- Participants -->
            <section class="event-section">
                <div class="section-tabs">
                    <button class="tab-btn active" data-tab="main">
                        Participantes (<span id="main-count">0</span>)
                    </button>
                    <button class="tab-btn" data-tab="waitlist">
                        Lista de Espera (<span id="waitlist-tab-count">0</span>)
                    </button>
                </div>
                
                <div id="participants-main-list" class="participants-list">
                    <!-- Participants will be rendered here -->
                </div>
                
                <div id="participants-waitlist-list" class="participants-list hidden">
                    <!-- Waitlist will be rendered here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Add Guest Modal -->
    <div id="add-guest-modal" class="modal">
        <div class="modal-backdrop" data-close-modal></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Adicionar Convidado</h2>
                <button class="modal-close" data-close-modal>×</button>
            </div>
            <form id="add-guest-form" class="modal-body">
                <div class="form-group">
                    <label for="guest-name-input">Nome do Convidado</label>
                    <input type="text" id="guest-name-input" required placeholder="Nome completo">
                </div>
                
                <div class="form-group">
                    <label for="guest-email-input">E-mail (opcional)</label>
                    <input type="email" id="guest-email-input" placeholder="email@exemplo.com">
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close-modal>Cancelar</button>
                    <button type="submit" class="btn btn-primary">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
